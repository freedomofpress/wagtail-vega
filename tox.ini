# Test matrix: the current Wagtail LTS (7.4) through the latest release, each
# with the Django and Python versions it supports.
#
#   tox                       # everything (needs the Python versions installed)
#   tox -e py310-wagtail74-django52
#   tox -e py312-wagtail81-django61 -- --browser-channel chrome
#
# Browser tests use Playwright's Chromium (`playwright install chromium`)
# unless you pass `--browser-channel chrome` to use an installed Chrome.

[tox]
envlist =
    py310-wagtail74-django52
    py313-wagtail74-django60
    py313-wagtail80-django60
    py314-wagtail81-django61
    lint
    js

[testenv]
extras = test
deps =
    wagtail74: wagtail>=7.4,<7.5
    wagtail80: wagtail>=8.0,<8.1
    wagtail81: wagtail>=8.1,<8.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
setenv =
    DATABASE_NAME = :memory:
commands =
    python -m pytest {posargs}

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:js]
skip_install = true
allowlist_externals = node
commands = node --test tests/js/dataset-block.test.mjs tests/js/wagtail-vega.test.mjs
