{% load wagtailadmin_tags %}{% if voyager %}<div class="wagtail-vega-spec">
    <wagtail-vega-voyager class="wagtail-vega-spec__toolbar" data-frame-url="{{ voyager.frame }}" data-rows-url="{{ voyager.rows }}" data-validate-url="{{ voyager.validate }}" data-allowed-hosts="{{ voyager.allowed_hosts }}">
        <button type="button" class="button button-small button-secondary bicolor button--icon" data-voyager-open>
            <span class="icon-wrapper">{% icon name="wagtail-vega-chart" %}</span>Build chart with Voyager
        </button>
        <p class="wagtail-vega-spec__note" data-voyager-note hidden></p>
    </wagtail-vega-voyager>
    {% include "django/forms/widgets/textarea.html" %}
</div>{% else %}{% include "django/forms/widgets/textarea.html" %}{% endif %}
