[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-vega"
dynamic = ["version"]
description = "Vega and Vega-Lite chart blocks for Wagtail StreamFields"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Freedom of the Press Foundation" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Wagtail",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
]
dependencies = ["wagtail>=7.4", "jsonschema>=4.18"]

[project.optional-dependencies]
# vl-convert 2.0 reworks its config API; cap until it's released and tested
ssr = ["vl-convert-python>=1.7,<2"]
test = ["pytest>=8", "pytest-django>=4.9", "vl-convert-python>=1.7,<2", "pytest-playwright>=0.7"]
docs = ["sphinx>=8.1", "furo>=2024.8.6", "myst-parser>=4", "sphinx-copybutton>=0.5"]
dev = ["wagtail-vega[test]", "ruff", "tox>=4"]

[tool.hatch.version]
path = "wagtail_vega/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["wagtail_vega", "scripts", "tests", "README.md", "package.json", "package-lock.json"]

[tool.hatch.build.targets.wheel]
packages = ["wagtail_vega"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
markers = ["e2e: browser tests using Playwright (tests/e2e)"]
filterwarnings = [
    # pytest-playwright's base_url fixture vs. pytest-django's live_server
    "ignore:Session-scoped fixtures defined as instance methods:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/testapp/migrations", "*.md", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
